server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers ------------------------------------------------------
  # Content-Security-Policy. Everything the app ships — its JS, CSS, fonts and
  # images — is self-hosted, so those are pinned to 'self'. The only third party
  # is Plaid Link, which loads its script and renders its bank-login iframe from
  # Plaid's domains (see apps/web/src/screens/AccountsScreen.tsx). connect-src
  # also admits the API origin, substituted from VITE_BREADCRUMBS_API_BASE_URL at
  # image build time (empty ⇒ same-origin, already covered by 'self').
  # 'unsafe-inline' is granted to styles only — the app uses inline style
  # attributes — never to scripts, so an injected <script> is still refused.
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.plaid.com; frame-src https://cdn.plaid.com https://*.plaid.com; connect-src 'self' https://*.plaid.com __API_ORIGIN__";

  # nginx does NOT merge add_header down into a location that sets its own
  # add_header — the child's set REPLACES the parent's entirely. So the two
  # locations below that set Cache-Control must restate every header they still
  # need. Keep the security headers here and in `location = /index.html` in sync.
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Single-page app: any unknown path is a client route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html must never be cached, or a deploy would leave browsers pointing
  # at asset hashes that no longer exist. This is also the response the SPA
  # fallback serves for every client route, so it carries the full header set.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
