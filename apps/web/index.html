<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/breadcrumbs.svg" />
    <link rel="apple-touch-icon" href="/breadcrumbs.svg" />
    <!-- Browser chrome follows the theme, so the app extends past its own frame. -->
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <title>Breadcrumbs — where is my money going?</title>
    <!-- No-flash theme init. External (not inline) so the production CSP can be
         a strict script-src 'self'. Render-blocking (no defer/async) so it runs
         before the CSS and there is no theme flash on first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
