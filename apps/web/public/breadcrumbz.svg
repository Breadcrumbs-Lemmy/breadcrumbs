<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Breadcrumbz">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6b5a"/>
      <stop offset="0.5" stop-color="#2f8f74"/>
      <stop offset="1" stop-color="#c07a40"/>
    </linearGradient>
    <!-- Punch the bowl's counter out of the "b" so the coin shows through it
         and the letter still reads at 16px. -->
    <mask id="counter">
      <rect width="40" height="40" fill="#fff"/>
      <circle cx="19.8" cy="24.5" r="3.6" fill="#000"/>
    </mask>
  </defs>
  <!-- The coin: the brand "trail" gradient (teal→green→honey), the money the
       name plays on. A faint struck-metal rim gives the disc its edge. Filled,
       not stroked, so it survives a 16px favicon and sits on any tab colour. -->
  <circle cx="20" cy="20" r="17" fill="url(#trail)"/>
  <circle cx="20" cy="20" r="14.6" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.3"/>
  <!-- A bold lowercase "b" stamped into the coin in the warm surface tone: a
       stem and the bowl that kisses it, the belly where the money settles. -->
  <g fill="#f7f4ee" mask="url(#counter)">
    <rect x="14.5" y="9" width="3.8" height="22" rx="1.9"/>
    <circle cx="19.8" cy="24.5" r="7"/>
  </g>
</svg>
